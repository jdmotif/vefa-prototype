<style>
*{margin:0;box-sizing:border-box}

.l{position:absolute;inset:0;width:1080px;height:1350px;object-fit:cover;object-position:center 55%}
.big{position:absolute;left:0;right:0;top:34px;text-align:center}

.bot .k{font-size:22px;font-weight:700;letter-spacing:4px;color:#5FCFB0}

.row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:26px}
